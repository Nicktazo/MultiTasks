projects:
  book_subscription:
    path: /mnt/c/Python Code/book_subscription
    tasks:
      - id: searchable-product-dropdown
        prompt: |
          BookManage.vue 的云打印产品模板下拉框改为可搜索模式，同时支持按名称和编码搜索。

          需求：
          1. 给 el-select 添加自定义 filter-method，同时匹配 prod_name 和 prod_code（不区分大小写）
          2. 下拉选项显示格式改为 "prod_code - prod_name"（如 "29805N - 手册"），方便用户辨识
          3. 选中后 el-select 显示的文本也应为 "prod_code - prod_name" 格式

          注意：只改前端，不改后端。产品数据字段为 prod_code 和 prod_name（snake_case 扁平数组）。
        tool: claude
        depends_on: []

      - id: review-searchable-dropdown
        prompt: |
          Review the searchable-product-dropdown changes in BookManage.vue. Check:
          1. filter-method correctly matches both prod_code and prod_name
          2. Display format "prod_code - prod_name" is consistent in options and selected value
          3. No regression on product selection and BOM loading flow
        tool: codex-review
        review_of: searchable-product-dropdown
        depends_on: [searchable-product-dropdown]
settings:
  max_parallel: 2
  notify: none
  dashboard_port: 18300
  timeout: 600
  state_dir: state
  log_dir: logs
  dirty_workspace: warn
